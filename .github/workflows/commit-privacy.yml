name: Check Commit Privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test privacy safeguards
        run: node --test tools/test-commit-privacy.cjs
      - name: Reject personal commit emails in current history
        run: node tools/check-commit-privacy.cjs --current
