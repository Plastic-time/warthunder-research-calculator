name: Build Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Application regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run test:actions
          if ($LASTEXITCODE -ne 0) { throw "Actions audit regression failed" }
          npm run test:assets
          if ($LASTEXITCODE -ne 0) { throw "Static asset audit regression failed" }
          npm run test:dependency-inventory
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit regression failed" }
          npm run audit:dependencies
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed" }
          npm run test:launcher-security
          if ($LASTEXITCODE -ne 0) { throw "Launcher security regression failed" }
          npm run test:wiki-http
          if ($LASTEXITCODE -ne 0) { throw "Wiki HTTP security regression failed" }
          npm run test:security
          if ($LASTEXITCODE -ne 0) { throw "Security tests failed" }
          node tools/test-wiki.cjs
          if ($LASTEXITCODE -ne 0) { throw "Wiki regression failed" }
          node tools/test-desktop-snapshot.cjs
          if ($LASTEXITCODE -ne 0) { throw "Desktop snapshot regression failed" }
          node --test tools/test-battle-ratings.cjs tools/test-battle-rating-correction.cjs tools/test-vehicle-cost-update.cjs tools/test-modification-update.cjs tools/test-release-version.cjs
          if ($LASTEXITCODE -ne 0) { throw "Release data or version regression failed" }
          node tools/test-planner.cjs
          if ($LASTEXITCODE -ne 0) { throw "Planner regression failed" }
          node --test tools/test-research-progress.cjs
          if ($LASTEXITCODE -ne 0) { throw "Research progress regression failed" }
          node --test tools/test-calculation-consistency.cjs
          if ($LASTEXITCODE -ne 0) { throw "Calculation consistency regression failed" }
          node tools/test-modifications.cjs
          if ($LASTEXITCODE -ne 0) { throw "Modification regression failed" }
          node tools/test-f4u7-modifications.cjs
          if ($LASTEXITCODE -ne 0) { throw "F4U-7 regression failed" }
          node tools/test-prerequisite-audit.cjs
          if ($LASTEXITCODE -ne 0) { throw "Prerequisite audit regression failed" }
          node tools/test-ui-entrypoints.cjs
          if ($LASTEXITCODE -ne 0) { throw "UI entrypoint regression failed" }
          node tools/test-tree-scroll.cjs
          if ($LASTEXITCODE -ne 0) { throw "Viewport scroll regression failed" }
          node tools/test-site-locales.cjs
          if ($LASTEXITCODE -ne 0) { throw "Locale coverage check failed" }
          node tools/test-multilingual-copy.cjs
          if ($LASTEXITCODE -ne 0) { throw "Multilingual terminology check failed" }
          node tools/test-english-copy.cjs
          if ($LASTEXITCODE -ne 0) { throw "English copy check failed" }
          node tools/test-localized-names.cjs
          if ($LASTEXITCODE -ne 0) { throw "Game name check failed" }
          node tools/test-vehicle-updates.cjs
          if ($LASTEXITCODE -ne 0) { throw "New vehicle badge check failed" }
          node tools/check-publish-privacy.cjs
          if ($LASTEXITCODE -ne 0) { throw "Privacy scan failed" }

      - name: Build packages
        run: |
          npm prune --omit=dev --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Production dependency preparation failed" }
          npm run package:release

      - name: Test release privacy safeguards
        shell: pwsh
        run: ./tools/test-release-privacy.ps1

      - name: Verify release contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          foreach ($suffix in @("-portable", "")) {
            $zipPath = Join-Path $PWD "WarThunderResearchCalculator-v$version$suffix.zip"
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              foreach ($file in @("public/research-progress.js", "public/planner.js", "public/i18n.js", "public/app-translations.js", "public/static-translations.js", "public/module-translations.js", "public/vehicle-names.json", "public/modification-names.json", "public/budget-glass.css", "public/press-feedback.css", "public/press-feedback.js", "public/vehicle-updates-data.js", "package.json", "package-lock.json", "public/index.html", "public/styles.css", "public/app.js", "public/ui-dark.css", "public/tree-navigation.css", "public/tree-navigation.js", "public/header-layout.js", "public/header-layout.css", "public/assets/navigation/ellipsis.svg", "public/assets/navigation/search.svg", "public/assets/navigation/sliders-horizontal.svg", "public/assets/flags/su.svg", "public/assets/navigation/plane.svg", "public/wiki-viewer.js", "public/wiki-viewer.css", "public/assets/wiki/book-open.svg", "public/assets/wiki/external-link.svg", "public/assets/wiki/rotate-cw.svg", "public/assets/wiki/x.svg", "public/assets/wiki/LICENSE", "public/vehicle-long-press.js", "public/roster.js", "public/roster.css", "public/modifications.js", "public/modification-planner.js", "public/tree-scroll.css", "public/tree-scroll.js", "main.js", "README.md", "README.en.md")) {
                $entry = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $file }
                if (-not $entry) { throw "Missing $file in $zipPath" }
                $reader = [System.IO.StreamReader]::new($entry.Open())
                try { $content = $reader.ReadToEnd() } finally { $reader.Dispose() }
                if ($content -cne (Get-Content -Raw -LiteralPath $file)) { throw "Stale $file in $zipPath" }
              }
              foreach ($file in @("public/assets/creator-avatar.jpg", "public/assets/research-emblem.png", "public/assets/navigation/gift.svg", "public/assets/navigation/golden-eagles.svg", "public/database/modifications/catalog.json", "public/database/modifications/israel_aviation.json", "public/database/modifications/ussr_aviation.json", "public/database/modifications/ussr_ground.json")) {
                $entry = $archive.GetEntry($file)
                if (-not $entry) { $entry = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $file } }
                if (-not $entry) { throw "Missing $file in $zipPath" }
                $stream = $entry.Open()
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '') }
                finally { $stream.Dispose(); $sha.Dispose() }
                if ($hash -ne (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash) { throw "Stale image in $zipPath" }
              }
              $securityFiles = @("src/wiki-http.js", "src/1-extract_tree_div.js", "src/3-request_details.js")
              if ($suffix -eq "") {
                $securityFiles += @("tools/launcher/LaunchPolicy.cs", "tools/launcher/Program.cs", "tools/check-launcher-policy.cjs", "tools/fixtures/launcher-policy-tests.cs", "tools/check-release-privacy.ps1", "tools/test-release-privacy.ps1")
              }
              foreach ($file in $securityFiles) {
                $entry = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $file }
                if (-not $entry) { throw "Missing security fix: $file" }
                $stream = $entry.Open()
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '') }
                finally { $stream.Dispose(); $sha.Dispose() }
                if ($hash -ne (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash) { throw "Stale security fix: $file" }
              }
              if ($suffix -eq "-portable") {
                foreach ($file in @("node.exe", "WarThunderResearchCalculator.exe")) {
                  $entry = $archive.GetEntry($file)
                  if (-not $entry -or $entry.Length -eq 0) { throw "Missing runtime: $file" }
                }
              }
              Write-Host "Verified $zipPath"
              $dataFiles = @("config/data-version.json", "config/battle-rating-update.json", "config/battle-rating-correction.json", "config/vehicle-cost-update.json", "public/database/modifications/catalog.json")
              $manifest = Get-Content -Raw docs/database/manifest.json | ConvertFrom-Json
              $dataFiles += @($manifest.files | ForEach-Object { $_.path })
              $catalog = Get-Content -Raw public/database/modifications/catalog.json | ConvertFrom-Json
              $dataFiles += @($catalog.chunks.PSObject.Properties | ForEach-Object { "public/" + $_.Value.path })
              foreach ($file in $dataFiles) {
                $entry = $archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $file }
                if (-not $entry) { throw "Missing packaged game data: $file" }
                $stream = $entry.Open()
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try { $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '') }
                finally { $stream.Dispose(); $sha.Dispose() }
                if ($hash -ne (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash) { throw "Stale packaged game data: $file" }
              }
              Write-Host "Verified all packaged tech trees, modification chunks and data provenance"
            } finally { $archive.Dispose() }
          }

      - name: Scan packaged files for secrets and personal paths
        shell: pwsh
        run: ./tools/check-release-privacy.ps1

      - name: Save verified packages for owner publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            WarThunderResearchCalculator-v*.zip
            WarThunderResearchCalculator-v*-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
