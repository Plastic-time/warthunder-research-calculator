name: Browser Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:actions
      - run: npm run audit:assets
      - name: Audit Actions before browser and Pages checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:actions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-checks-${{ github.run_id }}
          retention-days: 7
          path: |
            logs/wheel-check/*.png
            logs/web-cache-review/*.png
            logs/web-cache-review/browser-report.json
            logs/site-locales/*.png
            logs/calculation-consistency/*.png
            logs/calculation-consistency/browser-report.json
            logs/export-hd-check/*-detail.png
            logs/export-hd-check/browser-report.json
            logs/export-controls/*.png
            logs/export-controls/browser-report.json
            logs/plan-backup/*.png
            logs/plan-backup/browser-report.json
            logs/plan-concurrency/*.png
            logs/plan-concurrency/browser-report.json
            logs/tree-retry/*.png
            logs/tree-retry/browser-report.json
            logs/game-roster-browser/*.png
            logs/game-roster-browser/browser-report.json
