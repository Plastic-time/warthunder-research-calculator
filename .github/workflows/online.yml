name: Online Counter Checks
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/online/**"
      - ".github/workflows/online.yml"
  pull_request:
    paths:
      - "cloudflare/online/**"
      - ".github/workflows/online.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/online
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/online/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --include=dev --audit-level=low
      - run: npm test
      - run: npm run check:deploy
      - run: npm run test:runtime
