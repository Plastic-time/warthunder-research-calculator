name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/browser-checks.yml"
      - "tools/check-wheel.cjs"
      - "tools/check-web-cache.cjs"
      - "tools/check-tree-retry.cjs"
      - "tools/check-site-locales.cjs"
      - "tools/check-calculation-consistency.cjs"
      - "tools/check-game-roster-additions.cjs"
      - "tools/check-export-hd.cjs"
      - "tools/check-export-controls.cjs"
      - "tools/check-plan-backup.cjs"
      - "tools/check-plan-concurrency.cjs"
      - "tools/browser-test-runtime.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  browser:
    permissions:
      contents: read
    uses: ./.github/workflows/browser-checks.yml
  deploy:
    needs: browser
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify cache revisions before deploying
        run: npm run check:web-assets
      - run: npm run test:web-assets
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

