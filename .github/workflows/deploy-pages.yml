name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/browser-checks.yml"
      - "tools/check-wheel.cjs"
      - "tools/check-web-cache.cjs"
      - "tools/check-site-locales.cjs"
      - "tools/check-calculation-consistency.cjs"
      - "tools/check-export-hd.cjs"
      - "tools/check-export-controls.cjs"
      - "tools/check-plan-backup.cjs"
      - "tools/check-plan-concurrency.cjs"
      - "tools/browser-test-runtime.cjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  browser:
    permissions:
      contents: read
    uses: ./.github/workflows/browser-checks.yml
  deploy:
    needs: browser
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify cache revisions before deploying
        run: npm run check:web-assets
      - run: npm run test:web-assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

