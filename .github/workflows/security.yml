name: Application Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/browser-checks.yml
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Reject unregistered dependency entry points
        run: npm run check:dependencies
      - run: npm run test:dependency-inventory
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --ignore-scripts
      - run: npm run check:actions
      - run: npm run test:actions
      - run: npm run check:web-assets
      - run: npm run test:web-assets
      - name: Audit all registered executable dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run audit:dependencies
      - name: Check request handling
        run: npm run test:security
      - run: node tools/test-wiki.cjs
      - run: node --test tools/test-wiki-refresh-guard.cjs
      - run: node tools/test-desktop-snapshot.cjs
      - run: node tools/test-planner.cjs
      - run: node --test tools/test-planning-rules.cjs
      - run: node --test tools/test-datamine-updates.cjs
      - run: node --test tools/test-game-data-review.cjs
      - run: node tools/test-roster.cjs
      - run: node --test tools/test-roster-candidates.cjs
      - run: node --test tools/test-game-roster-additions.cjs
      - run: node --test tools/test-event-modifications.cjs
      - run: node --test tools/test-research-progress.cjs
      - run: node --test tools/test-calculation-consistency.cjs
      - run: node --test tools/test-plan-backup.cjs
      - run: node --test tools/test-route-export.cjs
      - run: node --test tools/test-tree-search.cjs
      - run: node tools/test-modifications.cjs
      - run: node --test tools/test-modification-refresh-guard.cjs
      - run: node tools/test-f4u7-modifications.cjs
      - run: node tools/test-prerequisite-audit.cjs
      - run: node --test tools/test-modification-icons.cjs
      - run: node tools/test-ui-entrypoints.cjs
      - run: node tools/test-tree-scroll.cjs
      - run: node tools/test-site-locales.cjs
      - run: node tools/test-multilingual-copy.cjs
      - run: node tools/test-english-copy.cjs
      - run: node tools/test-localized-names.cjs
      - run: node tools/test-vehicle-updates.cjs
      - run: node --test tools/test-online-client.cjs
      - run: node tools/check-publish-privacy.cjs
